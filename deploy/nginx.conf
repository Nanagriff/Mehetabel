# Self-hosting on nginx: copy dist/ to /var/www/chef and include this server block.
server {
    listen 80;
    server_name example.com;   # [TODO] your domain
    root /var/www/chef;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hashed assets and fonts never change once built
    location ~* ^/(_astro|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;
}
